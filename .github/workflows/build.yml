
name: Lazarus CI-CD with Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v5

      - name: Lazarus und Free Pascal installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus

      - name: Lazarus-Projekt kompilieren
        run: |
          lazbuild MiniLagerverwaltung/MiniLagerverwaltung.lpi

      - name: Programm als Artefakt bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: MiniLagerverwaltung-Linux
          path: MiniLagerverwaltung/MiniLagerverwaltung
          if-no-files-found: error

      - name: Docker Image bauen
        run: |
          docker build -t mini-lagerverwaltung:ci ./MiniLagerverwaltung

      - name: Docker Container testen
        run: |
          docker run --rm --entrypoint sh mini-lagerverwaltung:ci \
            -c 'test -x /app/MiniLagerverwaltung'
EOF
